org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
kotlin.code.style=official
# The build compiles against the Kotlin Analysis API, some 50 MB of jars. The daemon's defaults
# (512 MiB of heap, 384 MiB of metaspace) leave little room for that.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
