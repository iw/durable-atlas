version: 2
updates:
  # The actions CI pins by commit.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # One weekly pull request for the tool's build and its convention plugins, which share
  # the catalogue gradle/libs.versions.toml. The demo and the fixture are projects for the
  # tool to analyse; their versions are raised by hand.
  - package-ecosystem: gradle
    directories:
      - /
      - /build-logic
    schedule:
      interval: weekly
    groups:
      gradle:
        patterns: ["*"]
    ignore:
      # Held back while the tool targets Java 17; the catalogue says the same.
      # Clikt 5.2.0 calls java.util.List.removeLast(), which exists from Java 21.
      - dependency-name: "com.github.ajalt.clikt:clikt"
        versions: [">= 5.2.0"]
      # The Xbase library is compiled for Java 21 from 2.43.0.
      - dependency-name: "org.eclipse.xtext:org.eclipse.xtext.xbase.lib"
        versions: [">= 2.43.0"]
      # The IntelliJ platform modules must have exactly the version the Kotlin release was
      # built against. They move with Kotlin, by hand: a pull request that raises Kotlin
      # needs that version changed in it.
      - dependency-name: "com.jetbrains.intellij.platform:*"
      - dependency-name: "com.jetbrains.intellij.java:*"
      # The Analysis API runs on these but leaves them out of its published metadata, so the
      # catalogue names the versions it was built against. They move with Kotlin, by hand.
      - dependency-name: "com.github.ben-manes.caffeine:caffeine"
      - dependency-name: "org.jetbrains.kotlinx:kotlinx-collections-immutable-jvm"
      # The Temporal SDK reads event histories with this library and is built and tested with
      # the catalogue's version. It moves with the SDK, by hand.
      - dependency-name: "com.jayway.jsonpath:json-path"
      # A new major version of JUnit is a change of its own, made deliberately.
      - dependency-name: "org.junit:junit-bom"
        update-types: ["version-update:semver-major"]
    # Not held back, but not routine: a new layout engine (org.eclipse.elk) or typeface
    # (flatlaf-fonts-inter) arranges every diagram anew. Compare drawings before merging.
