name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # The class files are made for Java 17 by whichever JDK runs Gradle, and the
        # tool has to build, pass its tests and run on both.
        java: [17, 25]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      # The three wrappers: the tool's, the demo's and the fixture's.
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      # Compiles with warnings as errors and runs every test. The integration tests
      # start the fixture's and the demo's own Gradle builds.
      - name: Build and test
        run: ./gradlew build installDist
      - name: Build and test the fixture
        working-directory: fixtures/sample-monorepo
        run: ./gradlew build
      # The installed tool, as a user runs it: the demo's workflows from its Gradle
      # build, then its recorded histories laid over them.
      - name: Draw the demo
        run: |
          tool=cli/build/install/durable-atlas/bin/durable-atlas
          commit=$(git rev-parse HEAD)
          "$tool" run --repo demo --commit "$commit" --out build/demo
          "$tool" overlay --ir "build/demo/ir/$commit" --history demo/histories --out build/demo/coverage
          test -s "build/demo/diagrams/$commit/OrderWorkflow.svg"
          test -s build/demo/coverage/OrderWorkflow.coverage.svg
